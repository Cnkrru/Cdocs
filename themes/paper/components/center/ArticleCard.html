<article class="paper-post">
  <time class="paper-post-date">{{date}}</time>
  <h2 class="paper-post-title"><a href="{{href}}">{{title}}</a></h2>
  <p class="paper-post-desc">{{desc}}</p>
</article>
<style>
.paper-post {
  padding: 22px 0;
  border-bottom: 1px solid var(--line);
}
.paper-post:first-child { padding-top: 8px; }
.paper-post-date {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: .05em;
  color: var(--muted);
  text-transform: uppercase;
}
.paper-post-title {
  font-family: var(--font-serif);
  font-size: 21px;
  margin: 6px 0 8px;
  line-height: 1.45;
}
.paper-post-title a {
  color: var(--fg);
  text-decoration: none;
  transition: color .15s;
}
.paper-post-title a:hover { color: var(--accent); }
.paper-post-desc {
  margin: 0;
  color: var(--muted);
  font-size: 14.5px;
  line-height: 1.7;
}
</style>
