<details class="expand"><summary>{{title}}</summary><div class="expand-body">{{slot}}</div></details>
<style>
/* Expand 折叠面板：原生 details/summary，零 JS */
details.expand {
  margin: 20px 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
details.expand > summary {
  cursor: pointer;
  user-select: none;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  font-family: var(--font-serif);
  font-size: 15px;
  font-weight: 700;
  color: var(--fg);
  transition: background .15s;
}
details.expand > summary::-webkit-details-marker {
  display: none;
}
details.expand > summary:hover {
  background: var(--panel);
}
/* 箭头：折叠 ▸（-45deg），展开 ▾（45deg） */
details.expand > summary::before {
  content: '';
  width: 8px;
  height: 8px;
  flex: none;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  transform: rotate(-45deg) translate(1px, -1px);
  transition: transform .2s;
}
details.expand[open] > summary::before {
  transform: rotate(45deg);
}
details.expand[open] > summary {
  border-bottom: 1px solid var(--border-light);
}
details.expand > .expand-body {
  padding: 12px 16px 14px;
}
details.expand > .expand-body > :first-child {
  margin-top: 0;
}
details.expand > .expand-body > :last-child {
  margin-bottom: 0;
}
</style>
