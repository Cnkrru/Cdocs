<!DOCTYPE html>
<html lang="{{lang}}" data-theme="{{theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{var t=localStorage.getItem('theme')||document.documentElement.getAttribute('data-theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>{{title}}</title>
  <MetaHead/>
</head>
<body{{body_class}}>
<SkipLink/>
<Header/>
  <div class="layout">
{{ if nav_tree }}
    <LeftNav/>
{{ end }}
    <main class="content" id="main">
{{ if is_home }}
      <Hero/>
{{ if cards }}
      <CardGrid/>
{{ end }}
{{ else }}
{{ if breadcrumb }}
      <Breadcrumb/>
{{ end }}
{{body}}
{{ if last_updated }}
      <LastUpdated/>
{{ end }}
{{ if edit.show }}
      <EditLink/>
{{ end }}
{{ if pager.show }}
      <Pager/>
{{ end }}
{{body_end}}
{{ end }}
    </main>
{{ if show_toc }}
    <TocSidebar/>
{{ end }}
  </div>
<Footer/>
{{ if backtop.show }}
<BackToTop/>
{{ end }}
<Scripts/>
</body>
</html>
