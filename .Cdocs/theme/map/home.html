<!DOCTYPE html>
<html lang="{{lang}}" data-theme="{{theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{var t=localStorage.getItem('theme')||document.documentElement.getAttribute('data-theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>{{title}}</title>
  <MetaHead>
    <MetaDescription if="meta_desc"/>
    <MetaHighlight if="show_highlight"/>
    <MetaVars if="theme_vars"/>
    <MetaCss if="custom_css_href"/>
    {{extra_head}}
  </MetaHead>
</head>
<body{{body_class}}>
<SkipLink/>
<Header>
  <HeaderLeft>
    <MenuToggle if="header.show_menu_toggle"/>
    <Logo/>
    <TopNav if="header.topnav"><TopNavLink each="header.topnav"/></TopNav>
  </HeaderLeft>
  <HeaderCenter>
    <SearchBox if="header.show_search"/>
  </HeaderCenter>
  <HeaderRight>
    <HeaderNav if="header.header_nav"><HeaderNavLink each="header.header_nav"/></HeaderNav>
    <LangSwitch if="header.lang_switch.html"/>
    <VersionSelect if="header.versions"/>
    <ThemeToggle if="header.show_theme_toggle"/>
    <GhLink if="header.github"/>
  </HeaderRight>
</Header>
  <div class="layout no-sidebar">
    <main class="content" id="main">
      <Hero if="hero">
        <h1>{{hero.title}}</h1>
        <HeroSubtitle if="hero.subtitle"/>
        <HeroCta if="hero.cta_href"/>
      </Hero>
      <Cards if="cards"><Card each="cards"><CardDesc if="desc"/></Card></Cards>
    </main>
  </div>
<Footer if="footer.show">
  <FooterText if="footer.text"/>
  <FooterLinks if="footer.links"><FooterLink each="footer.links"/></FooterLinks>
</Footer>
<BackToTop if="backtop.show"/>
<Scripts>
  <ScriptHighlight if="scripts.highlight"/>
  <ScriptSearch if="scripts.search"/>
  <ScriptI18n if="scripts.i18n_json"/>
  <ScriptFeedback if="scripts.feedback"/>
</Scripts>
</body>
</html>
